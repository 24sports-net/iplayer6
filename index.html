
<!DOCTYPE html>
<html>
<head>
    <title>Game24x.xyz - Player</title>
    <meta content="noindex, nofollow, noarchive" name="robots"/>
    <meta name="referrer" content="no-referrer" />
    <script src="https://ssl.p.jwpcdn.com/player/v/8.33.2/jwplayer.js"></script>
    <script>jwplayer.key = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";</script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
        }
        .video-container {
            position: relative;
            height: 100vh;
            width: 100vw;
        }
        .jwplayer {
            position: absolute !important;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div id="player"></div>
    </div>

    <script>
        // Function to get query parameters
        function getQueryParams() {
            const params = {};
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            urlParams.forEach((value, key) => {
                params[key] = value;
            });
            return params;
        }

        const queryParams = getQueryParams();
        const videoUrl = queryParams.mpd;
        const keyId = queryParams.keyid;
        const key = queryParams.key;

        if (videoUrl && keyId && key) {
            const sources = [{
                file: videoUrl,
                drm: { "clearkey": { "keyId": keyId, "key": key } }
            }];

            jwplayer("player").setup({
                playlist: [{ sources: sources }],
                autostart: true,
                width: "100%",
                height: "100%",
                stretching: "exactfit",
                aspectratio: "16:9",
                controls: true,
                fullscreen: true
            });
        } else {
            document.getElementById("player").innerHTML = "<p style='color: red; text-align: center;'>Missing or invalid query parameters.</p>";
        }
    </script>
</body>
</html>
